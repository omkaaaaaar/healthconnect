<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Patient Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow p-5">
        <h1 class="text-primary">
          Welcome,
          <span th:text="${patientName}"></span>
        </h1>

        <h4 class="mt-3">
          City:
          <span th:text="${patientCity}"></span>
        </h4>

        <hr />

        <a href="/search-doctors" class="btn btn-primary mt-3">
          Search Doctors
        </a>

        <a href="/search-medicines" class="btn btn-success mt-3">
          Search Medicines
        </a>
      </div>
    </div>
    <br /><br />

    <a href="/my-appointments">
      <button
        style="
          width: 100%;
          padding: 14px;
          background: #2563eb;
          color: white;
          border: none;
          border-radius: 8px;
          font-size: 18px;
          cursor: pointer;
        "
      >
        My Appointments
      </button>
    </a>
    <a href="/logout">
      <button>Logout</button>
    </a>
  </body>
</html>
