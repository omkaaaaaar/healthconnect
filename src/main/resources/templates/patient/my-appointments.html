<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Appointments</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      :root {
        --primary: #4f7df3;
        --secondary: #2563eb;
        --bg: #f5f7fb;
        --text: #0f172a;
        --sub: #64748b;
        --border: #e2e8f0;
        --card: #ffffff;

        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
      }

      body {
        background: var(--bg);

        padding: 40px 24px;

        color: var(--text);
      }

      /* PAGE HEADER */

      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;

        margin-bottom: 34px;
      }

      .page-header h1 {
        font-size: 42px;
        font-weight: 800;
      }

      .page-header p {
        margin-top: 8px;

        color: var(--sub);
        font-size: 16px;
      }

      .back-btn {
        width: 56px;
        height: 56px;

        border-radius: 18px;

        background: white;

        border: 1px solid var(--border);

        display: flex;
        align-items: center;
        justify-content: center;

        text-decoration: none;

        color: var(--primary);

        font-size: 20px;

        transition: 0.3s;

        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      }

      .back-btn:hover {
        transform: translateY(-4px);
      }

      /* MAIN CARD */

      .container {
        background: white;

        border-radius: 34px;

        padding: 36px;

        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.06);

        border: 1px solid var(--border);
      }

      /* APPOINTMENT CARDS */

      .appointments {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .appointment-card {
        border: 1px solid var(--border);

        border-radius: 28px;

        padding: 28px;

        transition: 0.35s;

        background: white;
      }

      .appointment-card:hover {
        transform: translateY(-6px);

        box-shadow: 0 20px 40px rgba(79, 125, 243, 0.1);
      }

      /* TOP */

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;

        gap: 20px;

        margin-bottom: 24px;
      }

      .doctor-section {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .avatar {
        width: 72px;
        height: 72px;

        border-radius: 24px;

        background: #eef2ff;

        color: var(--primary);

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 30px;
      }

      .doctor-info h2 {
        font-size: 24px;

        margin-bottom: 8px;
      }

      .doctor-info p {
        color: var(--sub);

        font-size: 15px;
      }

      /* STATUS */

      .status {
        padding: 10px 18px;

        border-radius: 999px;

        font-size: 13px;
        font-weight: 700;
      }

      .accepted {
        background: #dcfce7;
        color: #15803d;
      }

      .pending {
        background: #fef3c7;
        color: #b45309;
      }

      .rejected {
        background: #fee2e2;
        color: #dc2626;
      }

      /* DETAILS GRID */

      .details {
        display: grid;

        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

        gap: 18px;
      }

      .detail-box {
        background: #f8fafc;

        border-radius: 20px;

        padding: 20px;
      }

      .detail-label {
        font-size: 13px;

        color: var(--sub);

        margin-bottom: 8px;

        font-weight: 600;

        text-transform: uppercase;

        letter-spacing: 0.5px;
      }

      .detail-value {
        font-size: 17px;
        font-weight: 700;
      }

      /* EMPTY STATE */

      .empty-state {
        padding: 80px 20px;

        text-align: center;
      }

      .empty-icon {
        width: 120px;
        height: 120px;

        border-radius: 32px;

        background: #eef2ff;

        color: var(--primary);

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 52px;

        margin: auto auto 24px;
      }

      .empty-state h2 {
        font-size: 34px;

        margin-bottom: 12px;
      }

      .empty-state p {
        color: var(--sub);

        font-size: 17px;

        margin-bottom: 30px;
      }

      .book-btn {
        display: inline-flex;
        align-items: center;
        gap: 12px;

        padding: 16px 28px;

        border-radius: 18px;

        background: linear-gradient(135deg, var(--primary), var(--secondary));

        color: white;

        text-decoration: none;

        font-weight: 700;

        transition: 0.3s;

        box-shadow: 0 16px 35px rgba(79, 125, 243, 0.25);
      }

      .book-btn:hover {
        transform: translateY(-4px);
      }

      /* RESPONSIVE */

      @media (max-width: 768px) {
        body {
          padding: 22px 16px;
        }

        .page-header {
          flex-direction: column;
          align-items: flex-start;
          gap: 20px;
        }

        .page-header h1 {
          font-size: 34px;
        }

        .container {
          padding: 24px;
        }

        .card-top {
          flex-direction: column;
        }

        .details {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <!-- HEADER -->

    <div class="page-header">
      <div>
        <h1>My Appointments</h1>

        <p>Track your healthcare consultations and appointment approvals</p>
      </div>

      <a href="http://localhost:8080/patient-dashboard" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
    </div>

    <!-- MAIN -->

    <div class="container">
      <!-- IF APPOINTMENTS EXIST -->

      <div
        class="appointments"
        th:if="${appointments != null && !appointments.isEmpty()}"
      >
        <div class="appointment-card" th:each="appointment : ${appointments}">
          <!-- TOP -->

          <div class="card-top">
            <div class="doctor-section">
              <div class="avatar">
                <i class="fa-solid fa-user-doctor"></i>
              </div>

              <div class="doctor-info">
                <h2 th:text="${appointment.doctorName}">Doctor Name</h2>

                <p>
                  Appointment ID:
                  <span th:text="${appointment.id}"></span>
                </p>
              </div>
            </div>

            <!-- STATUS -->

            <div>
              <span
                th:if="${appointment.status == 'Accepted'}"
                class="status accepted"
                th:text="${appointment.status}"
              >
              </span>

              <span
                th:if="${appointment.status == 'Pending'}"
                class="status pending"
                th:text="${appointment.status}"
              >
              </span>

              <span
                th:if="${appointment.status == 'Rejected'}"
                class="status rejected"
                th:text="${appointment.status}"
              >
              </span>
            </div>
          </div>

          <!-- DETAILS -->

          <div class="details">
            <div class="detail-box">
              <div class="detail-label">City</div>

              <div class="detail-value" th:text="${appointment.city}">
                Mumbai
              </div>
            </div>

            <div class="detail-box">
              <div class="detail-label">Appointment Date</div>

              <div
                class="detail-value"
                th:text="${appointment.appointmentDate}"
              >
                2026-06-09
              </div>
            </div>

            <div class="detail-box">
              <div class="detail-label">Appointment Time</div>

              <div
                class="detail-value"
                th:text="${appointment.appointmentTime}"
              >
                00:00
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- EMPTY STATE -->

      <div
        class="empty-state"
        th:if="${appointments == null || appointments.isEmpty()}"
      >
        <div class="empty-icon">
          <i class="fa-solid fa-calendar-xmark"></i>
        </div>

        <h2>No Appointments Yet</h2>

        <p>
          You have not booked any appointments yet. Start by searching for
          doctors nearby.
        </p>

        <a href="http://localhost:8080/search-doctors" class="book-btn">
          <i class="fa-solid fa-user-doctor"></i>

          Find Doctors
        </a>
      </div>
    </div>
  </body>
</html>
