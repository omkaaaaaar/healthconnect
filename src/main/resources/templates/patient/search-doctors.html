<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Search Doctors</title>

    ```
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    ```
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      ```
      <div class="card shadow p-5">
        <h2 class="text-center text-primary mb-4">Search Doctors by City</h2>

        <form action="/search-doctors" method="get">
          <div class="mb-3">
            <label class="form-label">Enter City</label>

            <input
              type="text"
              name="city"
              class="form-control"
              placeholder="Mumbai"
              required
            />
          </div>

          <button type="submit" class="btn btn-success w-100">
            Search Doctors
          </button>
        </form>
      </div>
      ```
    </div>
  </body>
</html>
