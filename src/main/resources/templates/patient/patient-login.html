<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Patient Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
            rgba(15, 23, 42, 0.5),
            rgba(15, 23, 42, 0.5)
          ),
          url("https://images.unsplash.com/photo-1584982751601-97dcc096659c?q=80&w=1400&auto=format&fit=crop");

        background-size: cover;
        background-position: center;
      }

      .login-card {
        width: 100%;
        max-width: 460px;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(16px);
        border-radius: 32px;
        padding: 40px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.18);
      }

      .logo {
        text-align: center;
        margin-bottom: 28px;
      }

      .logo-icon {
        width: 70px;
        height: 70px;
        background: #4f7df3;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 22px;
        margin: auto;
        margin-bottom: 16px;
        font-size: 28px;
      }

      .logo h2 {
        font-size: 34px;
      }

      .logo p {
        margin-top: 10px;
        color: #64748b;
      }

      .input-group {
        margin-bottom: 22px;
      }

      .input-group label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
      }

      .input-group input {
        width: 100%;
        height: 56px;
        border-radius: 16px;
        border: 1px solid #e2e8f0;
        padding: 0 18px;
        font-size: 16px;
        outline: none;
      }

      .input-group input:focus {
        border-color: #4f7df3;
      }

      .btn {
        width: 100%;
        height: 58px;
        border: none;
        border-radius: 18px;
        background: linear-gradient(135deg, #4f7df3, #2563eb);
        color: white;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 10px 25px rgba(79, 125, 243, 0.25);
      }

      .btn:hover {
        transform: translateY(-3px);
      }

      .bottom-text {
        text-align: center;
        margin-top: 22px;
        color: #64748b;
      }

      .bottom-text a {
        color: #2563eb;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <div class="login-card">
      <div class="logo">
        <div class="logo-icon">
          <i class="fa-solid fa-heart-pulse"></i>
        </div>

        <h2>Patient Login</h2>

        <p>Access your healthcare dashboard securely</p>
      </div>

      <!-- KEEP EXISTING ACTION -->
      <form action="/patient-login" method="post">
        <div class="input-group">
          <label>Email Address</label>

          <!-- KEEP NAME -->
          <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="input-group">
          <label>Password</label>

          <!-- KEEP NAME -->
          <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
          />
        </div>

        <button type="submit" class="btn">Login To Dashboard</button>
      </form>

      <div class="bottom-text">
        Don't have an account?

        <a href="http://localhost:8080/patient-register"> Register Now </a>
      </div>
    </div>
  </body>
</html>
