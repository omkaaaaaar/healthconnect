<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Search Medicines</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow p-5">
        <h1 class="text-center text-primary mb-4">Nearby Pharmacies</h1>

        <!-- SEARCH BAR -->

        <form action="/search-medicines" method="get">
          <div class="row mb-4">
            <div class="col-md-10">
              <input
                type="text"
                name="medicineName"
                class="form-control"
                placeholder="Search Medicine"
              />
            </div>

            <div class="col-md-2">
              <button class="btn btn-success w-100">Search</button>
            </div>
          </div>
        </form>

        <!-- TABLE -->

        <table class="table table-bordered">
          <thead class="table-dark">
            <tr>
              <th>Medicine</th>
              <th>Pharmacy</th>
              <th>Address</th>
              <th>City</th>
              <th>Quantity</th>
            </tr>
          </thead>

          <tbody>
            <tr th:each="medicine : ${medicines}">
              <td th:text="${medicine.medicineName}"></td>

              <td th:text="${medicine.pharmacyName}"></td>

              <td th:text="${medicine.pharmacyAddress}"></td>

              <td th:text="${medicine.city}"></td>

              <td th:text="${medicine.quantity}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
