<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HealthConnect Signup</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      :root {
        --primary: #4f7df3;
        --secondary: #2563eb;
        --text: #0f172a;
        --sub: #64748b;
        --border: #e2e8f0;
      }

      body {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 40px;

        background: linear-gradient(
            rgba(15, 23, 42, 0.72),
            rgba(15, 23, 42, 0.72)
          ),
          url("https://images.unsplash.com/photo-1631815588090-d4bfec5b1ccb?q=80&w=1600&auto=format&fit=crop");

        background-size: cover;
        background-position: center;
      }

      .auth-card {
        width: 100%;
        max-width: 620px;

        background: rgba(255, 255, 255, 0.96);

        backdrop-filter: blur(18px);

        border-radius: 36px;

        padding: 42px;

        box-shadow: 0 35px 70px rgba(0, 0, 0, 0.22);
      }

      .logo {
        text-align: center;
        margin-bottom: 34px;
      }

      .logo-icon {
        width: 82px;
        height: 82px;

        border-radius: 26px;

        background: linear-gradient(135deg, var(--primary), var(--secondary));

        display: flex;
        align-items: center;
        justify-content: center;

        margin: auto;
        margin-bottom: 18px;

        color: white;
        font-size: 34px;

        box-shadow: 0 18px 35px rgba(79, 125, 243, 0.35);
      }

      .logo h1 {
        font-size: 42px;

        margin-bottom: 10px;

        color: var(--text);
      }

      .logo p {
        color: var(--sub);
      }

      .info-box {
        background: #eef2ff;

        color: #2563eb;

        padding: 16px 20px;

        border-radius: 18px;

        margin-bottom: 26px;

        display: flex;
        align-items: center;
        gap: 12px;

        font-size: 14px;
        font-weight: 700;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      .full-width {
        grid-column: 1/-1;
      }

      .input-group {
        margin-bottom: 4px;
      }

      .input-group label {
        display: block;

        margin-bottom: 10px;

        font-size: 15px;
        font-weight: 600;
      }

      .input-group input,
      .input-group select {
        width: 100%;
        height: 60px;

        border-radius: 18px;

        border: 1px solid var(--border);

        padding: 0 20px;

        font-size: 15px;

        outline: none;

        transition: 0.3s;
      }

      .input-group input:focus,
      .input-group select:focus {
        border-color: var(--primary);

        box-shadow: 0 0 0 4px rgba(79, 125, 243, 0.12);
      }

      .signup-btn {
        width: 100%;
        height: 64px;

        border: none;

        border-radius: 18px;

        margin-top: 18px;

        background: linear-gradient(135deg, var(--primary), var(--secondary));

        color: white;

        font-size: 18px;
        font-weight: 700;

        cursor: pointer;

        transition: 0.35s;

        box-shadow: 0 18px 35px rgba(79, 125, 243, 0.28);
      }

      .signup-btn:hover {
        transform: translateY(-4px);
      }

      .bottom-text {
        text-align: center;

        margin-top: 24px;

        color: var(--sub);
      }

      .bottom-text a {
        color: var(--primary);

        text-decoration: none;

        font-weight: 700;
      }

      .hidden {
        display: none;
      }

      .home-link {
        position: absolute;
        top: 30px;
        left: 30px;

        width: 52px;
        height: 52px;

        border-radius: 16px;

        background: white;

        display: flex;
        align-items: center;
        justify-content: center;

        color: var(--primary);

        font-size: 20px;

        text-decoration: none;

        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }

      @media (max-width: 768px) {
        .form-grid {
          grid-template-columns: 1fr;
        }

        .auth-card {
          padding: 30px;
        }

        .logo h1 {
          font-size: 34px;
        }
      }
    </style>
  </head>

  <body>
    <a href="http://localhost:8080/" class="home-link">
      <i class="fa-solid fa-arrow-left"></i>
    </a>

    <div class="auth-card">
      <div class="logo">
        <div class="logo-icon">
          <i class="fa-solid fa-user-plus"></i>
        </div>

        <h1>Create Account</h1>

        <p>Join HealthConnect healthcare platform</p>
      </div>

      <div class="info-box">
        <i class="fa-solid fa-circle-info"></i>

        Role-specific fields appear automatically
      </div>

      <!-- =====================================
KEEP SAME
===================================== -->

      <form action="/signup" method="post">
        <div class="form-grid">
          <!-- ROLE -->

          <div class="input-group full-width">
            <label>Select Role</label>

            <select name="role" id="role" required>
              <option value="">Choose your account type</option>

              <option value="PATIENT">Patient</option>

              <option value="DOCTOR">Doctor</option>

              <option value="PHARMACIST">Pharmacist</option>
            </select>
          </div>

          <!-- FULL NAME -->

          <div class="input-group">
            <label>Full Name</label>

            <input
              type="text"
              name="fullName"
              placeholder="Enter full name"
              required
            />
          </div>

          <!-- CITY -->

          <div class="input-group">
            <label>City</label>

            <input type="text" name="city" placeholder="Enter city" required />
          </div>

          <!-- EMAIL -->

          <div class="input-group full-width">
            <label>Email Address</label>

            <input
              type="email"
              name="email"
              placeholder="Enter email address"
              required
            />
          </div>

          <!-- PASSWORD -->

          <div class="input-group full-width">
            <label>Password</label>

            <input
              type="password"
              name="password"
              placeholder="Create secure password"
              required
            />
          </div>

          <!-- DOCTOR FIELDS -->

          <div id="doctorFields" class="full-width hidden">
            <div class="input-group">
              <label>Specialization</label>

              <input
                type="text"
                name="specialization"
                placeholder="Ex: Cardiologist"
              />
            </div>
          </div>

          <!-- PHARMACIST FIELDS -->

          <div id="pharmacyFields" class="full-width hidden">
            <div class="input-group">
              <label>Pharmacy Name</label>

              <input
                type="text"
                name="pharmacyName"
                placeholder="Enter pharmacy name"
              />
            </div>

            <div class="input-group">
              <label>Pharmacy Address</label>

              <input
                type="text"
                name="pharmacyAddress"
                placeholder="Enter pharmacy address"
              />
            </div>
          </div>
        </div>

        <button type="submit" class="signup-btn">Create Account</button>
      </form>

      <div class="bottom-text">
        Already have an account?

        <a href="http://localhost:8080/login"> Login Now </a>
      </div>
    </div>

    <script>
      const roleSelect = document.getElementById("role");

      const doctorFields = document.getElementById("doctorFields");

      const pharmacyFields = document.getElementById("pharmacyFields");

      roleSelect.addEventListener("change", function () {
        doctorFields.classList.add("hidden");
        pharmacyFields.classList.add("hidden");

        if (this.value === "DOCTOR") {
          doctorFields.classList.remove("hidden");
        }

        if (this.value === "PHARMACIST") {
          pharmacyFields.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
