<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HealthConnect Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      :root {
        --primary: #4f7df3;
        --secondary: #2563eb;
        --bg: #f5f7fb;
        --text: #0f172a;
        --sub: #64748b;
        --border: #e2e8f0;
      }

      body {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 30px;

        background: linear-gradient(
            rgba(15, 23, 42, 0.72),
            rgba(15, 23, 42, 0.72)
          ),
          url("https://images.unsplash.com/photo-1584515933487-779824d29309?q=80&w=1600&auto=format&fit=crop");

        background-size: cover;
        background-position: center;
      }

      .auth-card {
        width: 100%;
        max-width: 520px;

        background: rgba(255, 255, 255, 0.96);

        backdrop-filter: blur(18px);

        border-radius: 34px;

        padding: 42px;

        box-shadow: 0 35px 70px rgba(0, 0, 0, 0.22);
      }

      .logo {
        text-align: center;
        margin-bottom: 34px;
      }

      .logo-icon {
        width: 82px;
        height: 82px;

        border-radius: 26px;

        background: linear-gradient(135deg, var(--primary), var(--secondary));

        display: flex;
        align-items: center;
        justify-content: center;

        margin: auto;
        margin-bottom: 18px;

        color: white;
        font-size: 34px;

        box-shadow: 0 18px 35px rgba(79, 125, 243, 0.35);
      }

      .logo h1 {
        font-size: 42px;
        margin-bottom: 10px;

        color: var(--text);
      }

      .logo p {
        color: var(--sub);
        font-size: 16px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;

        background: #eef2ff;

        color: #2563eb;

        padding: 12px 20px;

        border-radius: 999px;

        font-size: 14px;
        font-weight: 700;

        margin-bottom: 24px;
      }

      .input-group {
        margin-bottom: 22px;
      }

      .input-group label {
        display: block;

        margin-bottom: 10px;

        font-size: 15px;
        font-weight: 600;

        color: var(--text);
      }

      .input-group input,
      .input-group select {
        width: 100%;
        height: 60px;

        border-radius: 18px;

        border: 1px solid var(--border);

        padding: 0 20px;

        font-size: 16px;

        outline: none;

        background: white;

        transition: 0.3s;
      }

      .input-group input:focus,
      .input-group select:focus {
        border-color: var(--primary);

        box-shadow: 0 0 0 4px rgba(79, 125, 243, 0.12);
      }

      .login-btn {
        width: 100%;
        height: 62px;

        border: none;

        border-radius: 18px;

        background: linear-gradient(135deg, var(--primary), var(--secondary));

        color: white;

        font-size: 18px;
        font-weight: 700;

        cursor: pointer;

        margin-top: 10px;

        transition: 0.35s;

        box-shadow: 0 15px 35px rgba(79, 125, 243, 0.28);
      }

      .login-btn:hover {
        transform: translateY(-4px);
      }

      .bottom-text {
        text-align: center;

        margin-top: 24px;

        color: var(--sub);
      }

      .bottom-text a {
        color: var(--primary);

        font-weight: 700;

        text-decoration: none;
      }

      .home-link {
        position: absolute;
        top: 30px;
        left: 30px;

        width: 52px;
        height: 52px;

        border-radius: 16px;

        background: white;

        display: flex;
        align-items: center;
        justify-content: center;

        color: var(--primary);

        font-size: 20px;

        text-decoration: none;

        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }

      @media (max-width: 768px) {
        .auth-card {
          padding: 30px;
        }

        .logo h1 {
          font-size: 34px;
        }
      }
    </style>
  </head>

  <body>
    <a href="http://localhost:8080/" class="home-link">
      <i class="fa-solid fa-arrow-left"></i>
    </a>

    <div class="auth-card">
      <div class="logo">
        <div class="badge">
          <i class="fa-solid fa-shield-heart"></i>

          Secure Healthcare Login
        </div>

        <div class="logo-icon">
          <i class="fa-solid fa-heart-pulse"></i>
        </div>

        <h1>Welcome Back</h1>

        <p>Login to access your healthcare dashboard</p>
      </div>

      <!-- =====================================
KEEP THESE SAME
===================================== -->

      <form action="/login" method="post">
        <!-- ROLE -->

        <div class="input-group">
          <label>Select Role</label>

          <select name="role" required>
            <option value="">Choose your account type</option>

            <option value="PATIENT">Patient</option>

            <option value="DOCTOR">Doctor</option>

            <option value="PHARMACIST">Pharmacist</option>
          </select>
        </div>

        <!-- EMAIL -->

        <div class="input-group">
          <label>Email Address</label>

          <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <!-- PASSWORD -->

        <div class="input-group">
          <label>Password</label>

          <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <button type="submit" class="login-btn">Login To Dashboard</button>
      </form>

      <div class="bottom-text">
        Don't have an account?

        <a href="http://localhost:8080/signup"> Create Account </a>
      </div>
    </div>
  </body>
</html>
