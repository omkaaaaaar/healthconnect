<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Appointment Approval</title>

    <style>
      body {
        background: #f5f5f5;
        font-family: Arial;
      }

      .container {
        width: 85%;
        margin: auto;
        margin-top: 50px;
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0px 0px 10px #ccc;
      }

      h1 {
        color: #2563eb;
        text-align: center;
        margin-bottom: 40px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: #1f2937;
        color: white;
        padding: 15px;
      }

      td {
        padding: 15px;
        border: 1px solid #ddd;
      }

      select {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
      }

      .btn {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        margin-top: 5px;
      }

      .green {
        background: #16a34a;
      }

      .red {
        background: #dc2626;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Appointment Requests</h1>

      <table>
        <tr>
          <th>Patient</th>
          <th>Doctor</th>
          <th>City</th>
          <th>Status</th>
          <th>Timing</th>
          <th>Actions</th>
        </tr>

        <tr th:each="appointment : ${appointments}">
          <td th:text="${appointment.patientName}"></td>

          <td th:text="${appointment.doctorName}"></td>

          <td th:text="${appointment.city}"></td>

          <td th:text="${appointment.status}"></td>

          <td>
            <span th:text="${appointment.appointmentDate}"></span>
            <span th:text="${appointment.appointmentTime}"></span>
          </td>

          <td>
            <form action="/accept-appointment" method="post">
              <input type="hidden" name="id" th:value="${appointment.id}" />

              <select name="appointmentDate">
                <option>Today</option>
                <option>Tomorrow</option>
              </select>

              <select name="appointmentTime">
                <option>10 AM</option>
                <option>11 AM</option>
                <option>12 PM</option>
                <option>2 PM</option>
                <option>3 PM</option>
                <option>4 PM</option>
              </select>

              <button class="btn green" type="submit">Accept</button>
            </form>

            <form action="/reject-appointment" method="post">
              <input type="hidden" name="id" th:value="${appointment.id}" />

              <button class="btn red" type="submit">Reject</button>
            </form>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
