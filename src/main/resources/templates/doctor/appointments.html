<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Appointments</title>

    ```
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    ```
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      ```
      <div class="card shadow p-4">
        <h2 class="text-center text-primary mb-4">Appointment Requests</h2>

        <table class="table table-bordered table-hover">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Patient</th>
              <th>Doctor</th>
              <th>City</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr th:each="appointment : ${appointments}">
              <td th:text="${appointment.id}"></td>

              <td th:text="${appointment.patientName}"></td>

              <td th:text="${appointment.doctorName}"></td>

              <td th:text="${appointment.city}"></td>

              <td th:text="${appointment.status}"></td>

              <td>
                <a
                  th:href="@{/appointment/accept/{id}(id=${appointment.id})}"
                  class="btn btn-success btn-sm"
                >
                  Accept
                </a>

                <a
                  th:href="@{/appointment/reject/{id}(id=${appointment.id})}"
                  class="btn btn-danger btn-sm"
                >
                  Reject
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      ```
    </div>
  </body>
</html>
