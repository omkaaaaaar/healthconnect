<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Doctor Registration</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <div class="card shadow p-5">
        <h2 class="text-center text-primary mb-4">Doctor Registration</h2>

        <form action="/save-doctor" method="post">
          <div class="mb-3">
            <label class="form-label">Full Name</label>

            <input type="text" name="fullName" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>

            <input type="email" name="email" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">City</label>

            <input type="text" name="city" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Specialization</label>

            <input
              type="text"
              name="specialization"
              class="form-control"
              placeholder="Cardiologist, Dentist, etc."
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>

            <input
              type="password"
              name="password"
              class="form-control"
              required
            />
          </div>
          <label>Phone Number</label>
          <input type="text" name="phoneNumber" class="form-control" />

          <label>Clinic Address</label>
          <input type="text" name="clinicAddress" class="form-control" />

          <label>Available Timings</label>
          <input type="text" name="availableTimings" class="form-control" />

          <button type="submit" class="btn btn-success w-100">
            Register Doctor
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
