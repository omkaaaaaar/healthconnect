<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Update Doctor Profile</title>

    <style>
      body {
        background: #f5f5f5;
        font-family: Arial;
      }

      .container {
        width: 60%;
        margin: auto;
        margin-top: 50px;
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0px 0px 10px #ccc;
      }

      h1 {
        color: #2563eb;
        text-align: center;
        margin-bottom: 40px;
      }

      input {
        width: 100%;
        padding: 14px;
        margin-top: 10px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      button {
        width: 100%;
        padding: 14px;
        background: #16a34a;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Update Profile</h1>

      <form action="/update-doctor-profile" method="post">
        <input type="hidden" name="id" th:value="${doctor.id}" />

        <input type="hidden" name="fullName" th:value="${doctor.fullName}" />

        <input type="hidden" name="email" th:value="${doctor.email}" />

        <input type="hidden" name="city" th:value="${doctor.city}" />

        <input type="hidden" name="password" th:value="${doctor.password}" />

        <label>Specialization</label>

        <input
          type="text"
          name="specialization"
          th:value="${doctor.specialization}"
        />

        <label>Phone Number</label>

        <input
          type="text"
          name="phoneNumber"
          th:value="${doctor.phoneNumber}"
        />

        <label>Clinic Address</label>

        <input
          type="text"
          name="clinicAddress"
          th:value="${doctor.clinicAddress}"
        />

        <label>Available Timings</label>

        <input type="text" name="timings" th:value="${doctor.timings}" />

        <button type="submit">Save Changes</button>
      </form>
    </div>
  </body>
</html>
